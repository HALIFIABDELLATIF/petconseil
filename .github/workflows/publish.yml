name: Publication automatique

on:
  schedule:
    - cron: "0 7 * * 1"
    - cron: "0 7 * * 3"
    - cron: "0 7 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Générer l'article de la semaine
        env:
          MAX_ARTICLES: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          PA_ACCESS_KEY: ${{ secrets.PA_ACCESS_KEY }}
          PA_SECRET_KEY: ${{ secrets.PA_SECRET_KEY }}
          PA_TAG: ${{ secrets.PA_TAG }}
        run: npm run generate:article

      - name: Vérifier que le site compile
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: npm run build

      - name: Commit des nouveaux articles
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "affiliation-bot"
            git config user.email "affiliation-bot@users.noreply.github.com"
            git add content
            git commit -m "chore: publication automatique hebdomadaire"
            git push
          else
            echo "Aucun changement à publier cette semaine."
          fi
